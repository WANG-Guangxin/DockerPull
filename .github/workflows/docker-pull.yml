name: Docker Pull
on:
  issues:
    types: [opened]

jobs:
  new-issue-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Docker / Wget / Curl Pull
        run: |
          set -Eeuo pipefail

          issue_title="${{ github.event.issue.title }}"
          issue_number="${{ github.event.issue.number }}"
          echo "=== Issue #${issue_number}: ${issue_title} ==="

          FAILURE_NOTIFIED=0
          DISK_RESERVE_BYTES=$((2 * 1024 * 1024 * 1024))
          AVAILABLE_BYTES=$(df --output=avail -B1 . | tail -n1 | tr -d ' ')
          MAX_FILE_SIZE_BYTES=$((AVAILABLE_BYTES - DISK_RESERVE_BYTES))

          if (( MAX_FILE_SIZE_BYTES <= 0 )); then
            echo "Insufficient disk budget on runner."
            exit 1
          fi

          echo "Download size budget: ${MAX_FILE_SIZE_BYTES} bytes"

          notify_failure() {
            local exit_code="$1"
            local failed_command="$2"

            if [[ "$FAILURE_NOTIFIED" -eq 1 ]]; then
              return
            fi

            trap - ERR
            set +e
            gh issue comment "$issue_number" -b "❌ Task failed.

            **Issue:** \`${issue_title}\`
            **Exit code:** \`${exit_code}\`
            **Failed command:**
            \`\`\`
            ${failed_command}
            \`\`\`

            Please check the command format, verify that the download target is valid, and try again later."
            FAILURE_NOTIFIED=1
          }

          trap 'notify_failure "$?" "$BASH_COMMAND"' ERR

          post_comment() {
            gh issue comment "$issue_number" -b "$1"
          }

          get_remote_headers() {
            curl -fsSLI --retry 3 --retry-delay 5 --connect-timeout 20 "$1" || true
          }

          get_header_value() {
            local headers="$1"
            local header_name="$2"

            awk -v header_name="$header_name" '
              BEGIN { IGNORECASE=1 }
              $0 ~ "^" header_name ":" {
                value=$0
                sub(/^[^:]+:[[:space:]]*/, "", value)
                gsub("\r", "", value)
                last=value
              }
              END {
                if (last != "") {
                  print last
                }
              }
            ' <<< "$headers"
          }

          # Install rclone
          if ! command -v rclone &> /dev/null; then
            echo "Installing rclone..."
            sudo -v; curl https://rclone.org/install.sh | sudo bash
          fi
          rclone version

          # ===== Detect command type =====
          CMD_TYPE=""
          TARGET=""

          if [[ $issue_title =~ ^docker\ pull\ (.+)$ ]]; then
            CMD_TYPE="docker"
            TARGET="${BASH_REMATCH[1]}"
            echo "Command type: docker pull"
          elif [[ $issue_title =~ ^wget\ (.+)$ ]]; then
            CMD_TYPE="wget"
            TARGET="${BASH_REMATCH[1]}"
            echo "Command type: wget"
          elif [[ $issue_title =~ ^curl\ (.+)$ ]]; then
            CMD_TYPE="curl"
            TARGET="${BASH_REMATCH[1]}"
            echo "Command type: curl"
          else
            echo "Invalid issue title format."
            FAILURE_NOTIFIED=1
            post_comment "❌ Invalid issue title format.

            Please use one of the following formats:
            - \`docker pull <image>\`
            - \`wget <URL>\`
            - \`curl <URL>\`

            Examples:
            - \`docker pull nginx:latest\`
            - \`wget https://example.com/file.zip\`"
            exit 1
          fi

          # ===== Docker Pull =====
          if [[ "$CMD_TYPE" == "docker" ]]; then
            echo "Parsing docker pull arguments..."
            read -r -a args <<< "$TARGET"
            image_name=""
            options=()

            if [[ ${#args[@]} -eq 0 ]]; then
              FAILURE_NOTIFIED=1
              post_comment "❌ No image name was provided."
              exit 1
            fi

            while [[ ${#args[@]} -gt 0 ]]; do
                case "${args[0]}" in
                    -a|--all-tags)
                        options+=("${args[0]}")
                        args=("${args[@]:1}")
                        ;;
                    --disable-content-trust)
                        options+=("${args[0]}")
                        args=("${args[@]:1}")
                        ;;
                    --platform=*)
                        options+=("${args[0]}")
                        args=("${args[@]:1}")
                        ;;
                    --platform)
                        if [[ ${#args[@]} -lt 2 ]]; then
                          FAILURE_NOTIFIED=1
                          post_comment "❌ \`docker pull --platform\` is missing a platform value."
                          exit 1
                        fi
                        options+=("${args[0]}" "${args[1]}")
                        args=("${args[@]:2}")
                        ;;
                    -q|--quiet)
                        options+=("${args[0]}")
                        args=("${args[@]:1}")
                        ;;
                    *)
                        if [[ -z "$image_name" ]]; then
                            image_name="${args[0]}"
                        else
                            options+=("${args[0]}")
                        fi
                        args=("${args[@]:1}")
                        ;;
                esac
            done

            if [[ -z "$image_name" ]]; then
              FAILURE_NOTIFIED=1
              post_comment "❌ No image name was provided."
              exit 1
            fi

            echo "Pulling image: ${image_name}"
            docker pull "${options[@]}" "$image_name"

            save_image_name=${image_name//[:\/ ]/_}
            echo "Saving image to ${save_image_name}.tar.gz..."
            docker save "$image_name" | gzip > "./${save_image_name}.tar.gz"

            UPLOAD_DIR="DockerPull/${issue_number}/$(date +%Y%m%d_%H%M%S)"
            rclone copy --stats=30s --stats-one-line "./${save_image_name}.tar.gz" "E5:${UPLOAD_DIR}/"
            SHARE_LINK=$(rclone link "E5:${UPLOAD_DIR}/${save_image_name}.tar.gz")

            FAILURE_NOTIFIED=1
            post_comment "✅ Docker image download completed.

            **Image:** \`${image_name}\`

            **Download link:**
            ${SHARE_LINK}

            > After downloading, import the image with \`docker load < ${save_image_name}.tar.gz\`."

          # ===== Wget / Curl download =====
          elif [[ "$CMD_TYPE" == "wget" || "$CMD_TYPE" == "curl" ]]; then
            # Normalize the URL by removing wrapping quotes
            TARGET=$(echo "$TARGET" | sed 's/^"//;s/"$//;s/^'"'"'//;s/'"'"'$//')
            TARGET=$(echo "$TARGET" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

            if [[ ! "$TARGET" =~ ^https?:// ]]; then
              FAILURE_NOTIFIED=1
              post_comment "❌ Only http/https download URLs are supported.

              **Input:** \`${TARGET}\`"
              exit 1
            fi

            echo "Downloading: ${TARGET}"

            REMOTE_HEADERS=$(get_remote_headers "$TARGET")

            # Prefer the last URL path segment as the filename instead of the full URL
            url_without_query="${TARGET%%\?*}"
            url_without_fragment="${url_without_query%%#*}"
            filename_candidate="$(basename "$url_without_fragment")"
            content_disposition=$(get_header_value "$REMOTE_HEADERS" "content-disposition")
            if [[ -n "$content_disposition" && "$content_disposition" =~ filename\*=UTF-8\'\'([^;]+) ]]; then
              decoded_filename=$(printf '%b' "${BASH_REMATCH[1]//%/\\x}") || decoded_filename=""
              if [[ -n "$decoded_filename" ]]; then
                filename_candidate="$decoded_filename"
              fi
            elif [[ -n "$content_disposition" && "$content_disposition" =~ filename=\"?([^\";]+) ]]; then
              filename_candidate="${BASH_REMATCH[1]}"
            fi
            FILENAME=$(echo "$filename_candidate" | sed 's|[^a-zA-Z0-9._-]|_|g')
            if [[ -z "$FILENAME" || "$FILENAME" == "." || "$FILENAME" == "_"* ]]; then
              FILENAME="download_$(date +%Y%m%d_%H%M%S)"
            fi
            echo "Output filename: ${FILENAME}"

            # Try to read Content-Length before downloading so oversized files can fail fast
            echo "Checking remote file size..."
            remote_size=$(get_header_value "$REMOTE_HEADERS" "content-length")
            if [[ -n "${remote_size:-}" && "$remote_size" =~ ^[0-9]+$ ]]; then
              echo "Remote file size: ${remote_size} bytes"
              if (( remote_size > MAX_FILE_SIZE_BYTES )); then
                FAILURE_NOTIFIED=1
                post_comment "⚠️ The remote file is larger than the available runner capacity, so the download was stopped before it started.

                **Remote size:** \`${remote_size}\` bytes
                **Available budget:** \`${MAX_FILE_SIZE_BYTES}\` bytes"
                exit 1
              fi
            else
              echo "Remote file size unavailable, continuing download."
            fi

            # Download the file
            echo "Starting download..."
            if [[ "$CMD_TYPE" == "wget" ]]; then
              wget --tries=3 --retry-connrefused --waitretry=5 --timeout=30 -nv -O "$FILENAME" -- "$TARGET"
            else
              curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --silent --show-error -o "$FILENAME" -- "$TARGET"
            fi

            # Check the downloaded file size
            FILE_SIZE=$(du -h "$FILENAME" | cut -f1)
            FILE_SIZE_BYTES=$(stat -c%s "$FILENAME" 2>/dev/null || echo "0")
            echo "Downloaded file size: ${FILE_SIZE} (${FILE_SIZE_BYTES} bytes)"

            if [[ "$FILE_SIZE_BYTES" -eq 0 ]]; then
              FAILURE_NOTIFIED=1
              post_comment "❌ The downloaded file is empty, so the upload was cancelled."
              exit 1
            fi

            # Check whether the file exceeds the current runner capacity
            if [[ $FILE_SIZE_BYTES -gt $MAX_FILE_SIZE_BYTES ]]; then
              FAILURE_NOTIFIED=1
              post_comment "⚠️ The downloaded file exceeds the current runner capacity, so the upload was cancelled.

                **File size:** \`${FILE_SIZE}\`"
              exit 1
            fi

            UPLOAD_DIR="Downloads/${issue_number}/$(date +%Y%m%d_%H%M%S)"
            echo "Starting upload to E5:${UPLOAD_DIR}/${FILENAME}"
            rclone copy --stats=1m --stats-one-line "$FILENAME" "E5:${UPLOAD_DIR}/"
            echo "Upload completed, generating share link..."
            SHARE_LINK=$(rclone link "E5:${UPLOAD_DIR}/${FILENAME}")

            FAILURE_NOTIFIED=1
            post_comment "✅ File download completed.

              **File information:**
              - File name: \`${FILENAME}\`
              - File size: \`${FILE_SIZE}\`

              **Download link:**
              ${SHARE_LINK}

              > Check your cloud storage settings for link expiration. If the link expires, submit a new issue."
          fi

          echo "=== Done ==="
        shell: bash
        env:
          RCLONE_CONFIG_PASS: ${{ secrets.RCLONE_CONFIG_PASS }}
          GH_TOKEN: ${{ secrets.PAT }}
          RCLONE_CONFIG: ./config/rclone.conf
          

