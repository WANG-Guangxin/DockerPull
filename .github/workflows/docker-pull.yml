name: Docker Pull
on:
  issues:
    types: [opened]

jobs:
  new-issue-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          set -euo pipefail
          if ! command -v rclone &> /dev/null; then
            echo "Installing rclone..."
            sudo -v
            curl https://rclone.org/install.sh | sudo bash
          fi
          rclone version
        shell: bash

      - name: Check E5 quota and clean old uploads if needed
        run: python3 scripts/cleanup_old_uploads.py --apply
        shell: bash
        env:
          RCLONE_CONFIG_PASS: ${{ secrets.RCLONE_CONFIG_PASS }}
          RCLONE_CONFIG: ./config/rclone.conf

      - name: Run download bot
        run: |
          set -euo pipefail
          python3 scripts/download_bot.py \
            --issue-title "${{ github.event.issue.title }}" \
            --issue-number "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --rclone-remote "E5"
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          RCLONE_CONFIG_PASS: ${{ secrets.RCLONE_CONFIG_PASS }}
          GH_TOKEN: ${{ secrets.PAT }}
          RCLONE_CONFIG: ./config/rclone.conf
          

